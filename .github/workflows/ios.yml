name: iOS (arm64)

permissions:
  contents: read
  issues: write

on:
  push:
    paths:
      - "ios/**"
      - "protocol/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    name: 构建 KeShare arm64 IPA
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
          swiftc --version || true

      - name: SHA-KE-1024 自检
        run: |
          cd protocol
          clang -O2 -std=c99 -w -I. -o ke_test test/ke_selftest.c ks_ke1024.c
          ./ke_test

      - name: 构建 App
        id: build
        run: |
          cd ios
          set -o pipefail
          make app VERSION="${GITHUB_REF_NAME:-1.0.0}" BUILD="${{ github.run_number }}" 2>&1 | tee /tmp/build.log

      - name: 校验产物架构与最低系统
        run: |
          cd ios
          file build/KeShare.app/KeShare
          lipo -info build/KeShare.app/KeShare
          otool -l build/KeShare.app/KeShare | grep -A4 LC_BUILD_VERSION || true

      - name: 打包 IPA
        run: |
          cd ios
          make ipa

      - name: 上传 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeShare-ios-arm64-${{ github.run_number }}
          path: |
            ios/build/KeShare.ipa
            ios/build/KeShare.app/**
          retention-days: 30
          if-no-files-found: warn

      # 失败时把编译日志写进 Issue（公开可读，方便排查）
      - name: 失败时归档构建日志
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            for (const f of ['/tmp/build.log']) {
              try { log += fs.readFileSync(f, 'utf8'); } catch (e) { log += `(读不到 ${f}: ${e.message})\n`; }
            }
            if (!log) log = '(没有捕获到日志)';
            const body = [
              `运行: #${context.runNumber}  提交: ${context.sha.substring(0, 7)}`,
              `链接: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '', '```', log.slice(-60000), '```'
            ].join('\n');
            const title = `构建日志 ${context.runNumber} (${context.sha.substring(0, 7)})`;
            const list = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            });
            const same = list.data.find(i => i.title === title);
            if (same) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: same.number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body
              });
            }

      - name: 创建 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/build/KeShare.ipa
          generate_release_notes: true

