name: iOS (arm64)

on:
  push:
    paths:
      - "ios/**"
      - "protocol/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    name: 构建 KeShare arm64 IPA
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: SHA-KE-1024 自检
        run: |
          cd protocol
          clang -O2 -std=c99 -w -I. -o ke_test test/ke_selftest.c ks_ke1024.c
          ./ke_test

      - name: 构建 App
        run: |
          cd ios
          make app VERSION="${GITHUB_REF_NAME:-1.0.0}" BUILD="${{ github.run_number }}"

      - name: 校验产物架构与最低系统
        run: |
          cd ios
          file build/KeShare.app/KeShare
          otool -l build/KeShare.app/KeShare | grep -A4 LC_BUILD_VERSION || true
          # 必须包含 arm64
          lipo -info build/KeShare.app/KeShare

      - name: 打包 IPA
        run: |
          cd ios
          make ipa

      - name: 上传 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeShare-ios-arm64-${{ github.run_number }}
          path: |
            ios/build/KeShare.ipa
            ios/build/KeShare.app/**
          retention-days: 30

      - name: 创建 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/build/KeShare.ipa
          generate_release_notes: true
