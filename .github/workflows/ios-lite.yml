name: iOS Lite (arm64)

on:
  push:
    branches: [ master ]
    paths:
      - 'ios-lite/**'
      - '.github/workflows/ios-lite.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    name: 构建 KeShare Lite arm64 IPA
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcrun --sdk iphoneos --show-sdk-path
          clang --version | head -2

      - name: 构建 App
        run: |
          cd ios-lite
          set -o pipefail
          make app VERSION=0.0.1 BUILD="${{ github.run_number }}" 2>&1 | tee /tmp/build-lite.log

      - name: 架构校验
        run: |
          cd ios-lite
          lipo -info build/KeShareLite.app/KeShareLite

      - name: 安装 ldid 并伪签名
        run: |
          curl -fsSL -o /tmp/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_x86_64
          chmod +x /tmp/ldid
          cd ios-lite
          make sign LDID=/tmp/ldid

      - name: 打包 Lite IPA
        run: |
          cd ios-lite
          make ipa
          ls -la build/*.ipa

      - name: 推送 Lite IPA 到 artifacts 分支
        run: |
          cp ios-lite/build/KeShareLite.ipa "$RUNNER_TEMP/KeShare-Lite.ipa"
          cd "$RUNNER_TEMP"
          git init -q repo && cd repo
          git config user.name "KeShare CI"
          git config user.email "ci@keshare.local"
          git checkout -q -b artifacts-lite
          cp ../KeShare-Lite.ipa ./KeShare-Lite.ipa
          git add KeShare-Lite.ipa
          git commit -q -m "Lite IPA build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" artifacts-lite

      - name: 失败时归档日志
        if: failure()
        run: |
          tail -60 /tmp/build-lite.log || true